name: QEMU boot proof

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qemu_boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - name: Boot exact RAW image
        run: sh accept/qemu_boot.sh
